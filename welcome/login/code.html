<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Strategy Command Center Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#135bec",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4">
<div class="w-full max-w-md space-y-8">
<div class="flex flex-col items-center justify-center space-y-2">
<span class="material-symbols-outlined text-primary text-5xl">insights</span>
<h1 class="text-slate-900 dark:text-white text-2xl font-bold leading-tight tracking-tight text-center sm:text-3xl">Strategy Command Center</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal text-center">Welcome back, please enter your details.</p>
</div>
<div class="flex">
<div class="flex h-12 flex-1 items-center justify-center rounded-lg bg-slate-200 dark:bg-slate-800/60 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-slate-700 has-[:checked]:shadow-sm has-[:checked]:text-slate-900 has-[:checked]:dark:text-white text-slate-500 dark:text-slate-400 text-sm font-medium leading-normal transition-colors">
<span class="truncate">Login</span>
<input checked="" class="invisible w-0" name="auth-toggle" type="radio" value="Login"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-slate-700 has-[:checked]:shadow-sm has-[:checked]:text-slate-900 has-[:checked]:dark:text-white text-slate-500 dark:text-slate-400 text-sm font-medium leading-normal transition-colors">
<span class="truncate">Sign Up</span>
<input class="invisible w-0" name="auth-toggle" type="radio" value="Sign Up"/>
</label>
</div>
</div>
<div class="space-y-6">
<div class="flex flex-col">
<label class="text-slate-900 dark:text-white text-sm font-medium leading-normal pb-2">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500" data-icon="email">mail</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 pl-12 pr-4 text-base font-normal leading-normal" placeholder="Enter your email"/>
</div>
</div>
<div class="flex flex-col">
<label class="text-slate-900 dark:text-white text-sm font-medium leading-normal pb-2">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500" data-icon="lock">lock</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 pl-12 pr-12 text-base font-normal leading-normal" placeholder="Enter your password" type="password"/>
<button class="absolute right-0 h-full px-4 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-400" data-alt="Toggle password visibility">
<span class="material-symbols-outlined text-xl" data-icon="visibility-off">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-end">
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot Password?</a>
</div>
</div>
<div class="flex flex-col gap-4">
<button class="flex h-12 w-full items-center justify-center rounded-lg bg-primary px-6 text-base font-semibold text-white shadow-sm transition-all hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">Login</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-slate-300 dark:border-slate-700"></div>
<span class="mx-4 flex-shrink text-sm text-slate-500 dark:text-slate-400">Or continue with</span>
<div class="flex-grow border-t border-slate-300 dark:border-slate-700"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex h-12 w-full items-center justify-center gap-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-6 text-sm font-medium text-slate-900 dark:text-white shadow-sm transition-all hover:bg-slate-50 dark:hover:bg-slate-700/50">
<svg class="h-5 w-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_105_2698)"><path d="M22.56 12.25C22.56 11.45 22.49 10.68 22.36 9.92H12V14.26H17.95C17.72 15.61 17.06 16.79 16.03 17.55V20.18H19.68C21.62 18.39 22.56 15.56 22.56 12.25Z" fill="#4285F4"></path><path d="M12 23C14.97 23 17.45 22.02 19.23 20.47L16.03 17.55C15.04 18.23 13.67 18.66 12 18.66C9.39 18.66 7.17 16.99 6.38 14.7H2.63V17.62C4.38 20.88 7.9 23 12 23Z" fill="#34A853"></path><path d="M6.38 14.7C6.18 14.12 6.08 13.51 6.08 12.9C6.08 12.29 6.18 11.68 6.38 11.1L2.63 8.18C1.91 9.59 1.5 11.19 1.5 12.9C1.5 14.61 1.91 16.21 2.63 17.62L6.38 14.7Z" fill="#FBBC05"></path><path d="M12 7.14C13.56 7.14 14.86 7.68 15.84 8.6L19.3 5.18C17.45 3.42 14.97 2.44 12 2.44C7.9 2.44 4.38 4.92 2.63 8.18L6.38 11.1C7.17 8.81 9.39 7.14 12 7.14Z" fill="#EA4335"></path></g><defs><clippath id="clip0_105_2698"><rect fill="white" height="24" width="24"></rect></clippath></defs></svg>
                        Google
                    </button>
<button class="flex h-12 w-full items-center justify-center gap-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-6 text-sm font-medium text-slate-900 dark:text-white shadow-sm transition-all hover:bg-slate-50 dark:hover:bg-slate-700/50">
<svg class="h-5 w-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V5C21 3.89543 20.1046 3 19 3Z" fill="#0A66C2"></path><path d="M8 11H10.5V17H8V11Z" fill="white"></path><path d="M9.25 8C8.56 8 8 8.56 8 9.25C8 9.94 8.56 10.5 9.25 10.5C9.94 10.5 10.5 9.94 10.5 9.25C10.5 8.56 9.94 8 9.25 8Z" fill="white"></path><path d="M11.5 11H14.25V12.13C14.25 12.13 14.5 11.5 16 11.5C17.5 11.5 18 12.5 18 14V17H15.5V14.5C15.5 13.5 15 13 14 13C13 13 12.5 13.5 12.5 14.5V17H11.5V11Z" fill="white"></path></svg>
                        LinkedIn
                    </button>
</div>
</div>
</div>
</div>
</body></html>
